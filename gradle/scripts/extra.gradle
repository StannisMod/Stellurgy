// This file is automatically applied after build.gradle + dependencies.gradle is ran

// If you wish to use the default helper methods, uncomment the line below
// apply from: 'gradle/scripts/helpers.gradle'

// Error Prone's ImmutableChecker, as a CHECK-ONLY compile. Error Prone no longer runs on a Java 8
// javac, and the mod must keep compiling on its Java 8 toolchain, so the main sources are compiled a
// second time on a JDK 21 toolchain with `--release 8`; the output is thrown away. A type annotated
// @Immutable that is not deeply immutable fails `check`.
configurations {
    errorprone
}

dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.36.0'
}

def errorproneCheck = tasks.register('errorproneCheck', JavaCompile) {
    group = 'verification'
    description = 'Compiles the main sources with Error Prone (ImmutableChecker only); output is discarded.'
    def main = tasks.named('compileJava', JavaCompile).get()
    source = main.source
    classpath = main.classpath
    destinationDirectory = layout.buildDirectory.dir('errorprone/classes')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.release = 8
    options.encoding = 'UTF-8'
    options.annotationProcessorPath = configurations.errorprone
    options.fork = true
    options.forkOptions.jvmArgs += [
        '--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
    ]
    options.compilerArgs = [
        '-XDcompilePolicy=simple',
        '--should-stop=ifError=FLOW',
        '-Xplugin:ErrorProne -XepDisableAllChecks -Xep:Immutable:ERROR -Xep:ImmutableEnumChecker:OFF',
        '-nowarn',
    ]
}

tasks.named('check') {
    dependsOn errorproneCheck
}
